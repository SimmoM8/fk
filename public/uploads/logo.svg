<svg
    class="fk-logo"
    width="160"
    height="160"
    viewBox="0 0 160 160"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="FK logo"
>
    <defs>
        <linearGradient id="fk-ring-gradient" x1="8%" y1="88%" x2="92%" y2="12%">
            <stop offset="0%" stop-color="#ff2d00" />
            <stop offset="16%" stop-color="#ff9a00" />
            <stop offset="30%" stop-color="#d6ff00" />
            <stop offset="46%" stop-color="#00d9ff" />
            <stop offset="62%" stop-color="#0077ff" />
            <stop offset="80%" stop-color="#c000ff" />
            <stop offset="100%" stop-color="#ff006a" />
        </linearGradient>
    </defs>

    <circle
        cx="80"
        cy="80"
        r="60"
        fill="none"
        stroke="url(#fk-ring-gradient)"
        stroke-width="9"
    />

    <text
        x="80"
        y="80"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#ffffff"
        font-size="38"
        font-weight="700"
        font-family="Arial, Helvetica, sans-serif"
        letter-spacing="1.5"
    >
        FK
    </text>
</svg>